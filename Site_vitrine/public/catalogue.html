<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneCocktail — Catalogue des Cocktails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,600;0,700;0,800;1,800;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- Barre de navigation -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="./index.html" class="brand-link">
        <img src="./assets/logo.png" alt="Logo OneCocktail" class="brand-logo"
             onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='./logo.png';}else{this.style.display='none';}" />
        <span class="brand-title">ONE <span>COCKTAIL</span></span>
      </a>
      <nav class="nav-links">
        <a href="./index.html" class="nav-btn">Accueil</a>
        <a href="./catalogue.html" class="nav-btn active">Catalogue</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <!-- Panneau de filtrage -->
    <section class="filter-panel">
      <div class="filter-panel-accent">
        <label for="filter-ingredient">Filtrer le catalogue</label>
        <div class="filter-inputs">
          <select id="filter-ingredient" class="select-pop">
            <option value="">Tous les ingrédients</option>
          </select>
          <input type="text" id="search-input" class="input-pop" placeholder="Rechercher un cocktail (ex: Mojito, Rhum...)" />
        </div>
      </div>
      <button type="button" id="btn-reset" class="btn-orange">Tout afficher</button>
    </section>

    <!-- Grille des recettes -->
    <h1 class="section-heading">Carte des cocktails (<span id="count-recettes">0</span>)</h1>
    <section id="catalog-grid" class="cocktails-grid"></section>
  </main>

  <footer class="site-footer">
    Synchronisé automatiquement avec votre machine OneCocktail
  </footer>

  <script>
    let allRecettes = [];
    const PILL_COLORS = ["pill-blue", "pill-orange", "pill-yellow", "pill-green"];

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function loadCatalog() {
      try {
        const res = await fetch("./api/catalog.json?t=" + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        allRecettes = Array.isArray(data.recettes) ? data.recettes : [];

        const select = document.getElementById("filter-ingredient");
        (Array.isArray(data.ingredients) ? data.ingredients : []).forEach(ing => {
          const opt = document.createElement("option");
          opt.value = ing;
          opt.textContent = ing;
          select.appendChild(opt);
        });

        renderGrid(allRecettes);
      } catch (e) {
        document.getElementById("catalog-grid").innerHTML =
          `<div class="pop-card" style="grid-column: 1 / -1;"><div class="pop-card-body"><p style="color:#dc2626;font-weight:800;">Erreur lors du chargement du catalogue JSON (${escapeHtml(e.message)}).</p></div></div>`;
      }
    }

    function renderGrid(list) {
      const grid = document.getElementById("catalog-grid");
      document.getElementById("count-recettes").textContent = list.length;

      if (list.length === 0) {
        grid.innerHTML = `<div class="pop-card" style="grid-column: 1 / -1;"><div class="pop-card-body"><p style="font-weight:700;color:#475569;">Aucun cocktail ne correspond à votre recherche.</p></div></div>`;
        return;
      }

      grid.innerHTML = list.map(r => {
        const ings = Array.isArray(r.ingredients) ? r.ingredients : [];
        const totalMl = ings.reduce((sum, i) => sum + Number(i.ml || 0), 0);

        const pillsHtml = ings.map((i, idx) => {
          const colorClass = PILL_COLORS[idx % PILL_COLORS.length];
          return `<span class="pill ${colorClass}">${escapeHtml(i.ingredient)} <strong>${Number(i.ml || 0)} ml</strong></span>`;
        }).join("");

        const conseils = Array.isArray(r.conseil) ? r.conseil : [];
        const conseilHtml = conseils.length
          ? `<div class="conseil-dashed">À ajouter : ${escapeHtml(conseils.join(", "))}</div>`
          : "";

        return `
          <article class="cocktail-item">
            <div>
              <div class="cocktail-top">
                <h2 class="cocktail-title">${escapeHtml(r.nom || "Sans nom")}</h2>
                <span class="cocktail-ml">${totalMl} ml</span>
              </div>
              <div class="pills-wrap">${pillsHtml}</div>
            </div>
            ${conseilHtml}
          </article>
        `;
      }).join("");
    }

    function applyFilters() {
      const query = document.getElementById("search-input").value.trim().toLowerCase();
      const ingFilter = document.getElementById("filter-ingredient").value;

      const filtered = allRecettes.filter(r => {
        const ings = Array.isArray(r.ingredients) ? r.ingredients : [];
        const nom = (r.nom || "").toLowerCase();
        const matchText = !query ||
          nom.includes(query) ||
          ings.some(i => (i.ingredient || "").toLowerCase().includes(query));
        const matchIng = !ingFilter ||
          ings.some(i => i.ingredient === ingFilter);
        return matchText && matchIng;
      });
      renderGrid(filtered);
    }

    document.getElementById("search-input").addEventListener("input", applyFilters);
    document.getElementById("filter-ingredient").addEventListener("change", applyFilters);
    document.getElementById("btn-reset").addEventListener("click", () => {
      document.getElementById("search-input").value = "";
      document.getElementById("filter-ingredient").value = "";
      renderGrid(allRecettes);
    });

    loadCatalog();
  </script>
</body>
</html>
