name: Déploiement Site Vitrine OneCocktail

on:
  push:
    branches: ["main"]
    paths:
      - "Site_vitrine/public/**"
      - ".github/workflows/deploy-vitrine.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparation de l'artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'Site_vitrine/public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publication sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4